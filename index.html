<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>하이바트레이닝 풀업 챌린지</title>

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">    

    <style>
        :root {
            font-family: system-ui, -apple-system, 'Malgun Gothic', sans-serif;
            color: #17212f;
            background: #f3f6fa;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 24px 12px; }

        .app {
            max-width: 580px;
            margin: auto;
            padding: 28px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 36px #1b355015;
        }

        h1 { font-size: 1.6rem; margin: 0 0 8px; }
        .sub { color: #64748b; line-height: 1.6; margin: 0 0 24px; }

        .inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label { font-weight: 700; font-size: .9rem; }

        input {
            display: block;
            width: 100%;
            margin-top: 8px;
            padding: 13px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
        }

        .actions { display: flex; gap: 10px; margin: 18px 0; }

        button {
            flex: 1;
            padding: 13px 16px;
            border: 0;
            border-radius: 11px;
            background: #1459bc;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        button.secondary { background: #eaf0f8; color: #17467c; }
        button:disabled { opacity: .45; cursor: not-allowed; }
        .error { color: #b91c1c; min-height: 1.5em; }

        .panel {
            margin-top: 12px;
            padding: 18px;
            background: #f2f6fd;
            border-radius: 18px;
        }

        .panel h2 { font-size: 1.1rem; margin: 0 0 8px; }

        .sets {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 7px;
            margin: 20px 0;
        }

        .set {
            padding: 14px 2px;
            background: white;
            border-radius: 12px;
            text-align: center;
        }

        .set strong { font-size: 1.6rem; color: #1459bc; }
        .set small { display: block; margin-top: 5px; color: #64748b; }
        .total { text-align: right; font-weight: 700; }
        .hint { font-size: .88rem; color: #59687b; line-height: 1.65; }

        .check { display: flex; align-items: center; gap: 10px; margin: 18px 0; }
        .check input { width: auto; margin: 0; accent-color: #1459bc; }
        .check label { font-weight: 500; }
        .status { min-height: 1.4em; font-size: .9rem; color: #176a46; }

        .foot {
            margin-top: 24px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: .83rem;
            color: #64748b;
            line-height: 1.7;
        }

        .aru-image {
            display: block;
            width: 100%;
            max-width: 490px;
            height: auto;
            margin: 0 auto 18px;
            border-radius: 14px;
        }

        @media (max-width: 420px) {
            .app { padding: 20px 15px; }
            .sets { gap: 4px; }
            .set strong { font-size: 1.35rem; }
        }
    </style>
</head>
<body>
    <main class="app">
        <img class="aru-image" src="https://i.imgur.com/CJdUSkz.png"
             alt="철봉에서 풀업하는 보더콜리 아루">
        <h1>💪 하이바트레이닝 풀업 챌린지</h1>
        <p class="sub">
            현재 연속으로 할 수 있는 최대 풀업 횟수를 입력하세요.
            하루 5세트 목표를 계산해 드립니다.
        </p>

        <div class="inputs">
            <label for="max">
                최대 풀업 개수
                <input id="max" type="number" min="1" max="500" step="1"
                       value="5" inputmode="numeric">
            </label>
            <label for="day">
                훈련일수 (운동한 날)
                <input id="day" type="number" min="1" max="10000" step="1"
                       value="1" inputmode="numeric">
            </label>
        </div>

        <p id="error" class="error" role="alert"></p>

        <div class="actions">
            <button id="prev" class="secondary" type="button">← 이전 날</button>
            <button id="next" type="button">다음 날 →</button>
        </div>

        <section id="panel" class="panel" aria-live="polite">
            <h2 id="heading"></h2>
            <div id="sets" class="sets"></div>
            <div id="total" class="total"></div>
            <p id="guide" class="hint"></p>
        </section>

        <div class="check">
            <input type="checkbox" id="done">
            <label for="done">오늘의 훈련을 완료했어요</label>
        </div>

        <p id="status" class="status" aria-live="polite"></p>
        <button id="reset" class="secondary" type="button">기록 초기화</button>

        <div class="foot">
            권장: 세트 사이 충분히 쉬고, 자세가 무너지거나 통증이 생기면 중단하세요.
            이 계산기는 일반적인 챌린지용 예시이며 개인별 훈련 처방은 아닙니다.
            최대 1~2개인 경우 보조 풀업을 활용해 5세트를 완성할 수 있습니다.
            훈련일수는 휴식일을 제외한 실제 운동일 기준입니다.
            기록은 이 브라우저에만 저장됩니다.
        </div>
    </main>

    <script>
        (() => {
            'use strict';

            // DOM 요소 및 기본 설정
            const $ = id => document.getElementById(id);
            const maxEl = $('max');
            const dayEl = $('day');
            const doneEl = $('done');
            const storageKey = 'haiba-pullup-challenge-v2';

            // 5일 주기로 변화하는 세트별 감소량
            const patterns = [
                [0, 1, 2, 3, 4],
                [0, 1, 2, 3, 3],
                [0, 1, 2, 2, 3],
                [0, 1, 1, 2, 3],
                [0, 0, 1, 2, 3]
            ];

            let state = { max: 5, day: 1, completed: {} };

            // 이전 기록 불러오기
            try {
                const saved = JSON.parse(localStorage.getItem(storageKey));
                if (saved && Number.isInteger(saved.max) &&
                    Number.isInteger(saved.day) && saved.completed &&
                    typeof saved.completed === 'object') {
                    state = {
                        max: saved.max,
                        day: saved.day,
                        completed: saved.completed
                    };
                }
            } catch (error) {
                // 저장된 데이터가 손상되었거나 접근할 수 없으면 기본값 사용
            }

            maxEl.value = state.max;
            dayEl.value = state.day;

            // 브라우저에 기록 저장
            function save() {
                try {
                    localStorage.setItem(storageKey, JSON.stringify(state));
                } catch (error) {
                    $('status').textContent = '이 브라우저에서는 기록 저장이 제한됩니다.';
                }
            }

            // 날짜별 5세트 목표 계산
            function plan(max, day) {
                const cycle = Math.floor((day - 1) / 5);
                const phase = (day - 1) % 5;

                // 초급(1~4개): 10훈련일마다 +1
                // 5개 이상: 5훈련일마다 +1
                const target = max + (max < 5
                    ? Math.floor((day - 1) / 10)
                    : cycle);

                const pattern = patterns[phase];
                const reps = pattern.map((drop, index) => {
                    if (target <= 4) {
                        // 초급자는 세트별 목표를 완만하게 설정
                        const base = Math.max(1, Math.round(target * (1 - index * .17)));
                        return Math.min(target, base + (phase >= index + 1 ? 1 : 0));
                    }

                    return Math.max(1, target - drop);
                });

                return { reps, target };
            }

            // 입력값 확인 및 화면 갱신
            function render() {
                const max = Number(maxEl.value);
                const day = Number(dayEl.value);
                const valid = Number.isInteger(max) && max >= 1 && max <= 500 &&
                              Number.isInteger(day) && day >= 1 && day <= 10000;

                $('error').textContent = valid
                    ? ''
                    : '최대개수는 1~500, 훈련일수는 1~10000 사이의 정수를 입력해 주세요.';

                $('panel').hidden = !valid;
                doneEl.disabled = !valid;
                $('prev').disabled = !valid || day <= 1;
                $('next').disabled = !valid || day >= 10000;

                if (!valid) {
                    $('status').textContent = '';
                    return;
                }

                state.max = max;
                state.day = day;

                const { reps, target } = plan(max, day);
                $('heading').textContent = `${day}일 차 · 목표 5세트`;

                const setElements = reps.map((count, index) => {
                    const box = document.createElement('div');
                    box.className = 'set';

                    const number = document.createElement('strong');
                    number.textContent = count;

                    const label = document.createElement('small');
                    label.textContent = `${index + 1}세트`;

                    box.append(number, label);
                    return box;
                });

                $('sets').replaceChildren(...setElements);
                $('total').textContent = `총 ${reps.reduce((sum, n) => sum + n, 0)}개`;
                $('guide').textContent =
                    `오늘 첫 세트 목표: ${target}개 · ` +
                    `${max < 5 ? '초급자 완만 증가(10훈련일 주기)' : '5훈련일 주기 증가'} · ` +
                    '세트 사이 2~3분 이상 휴식(필요하면 더 길게)';

                const recordId = `${max}:${day}`;
                doneEl.checked = !!state.completed[recordId];
                $('status').textContent = doneEl.checked
                    ? '✓ 이 날의 훈련을 완료했습니다.'
                    : '';

                save();
            }

            // 이벤트 연결
            [maxEl, dayEl].forEach(el => el.addEventListener('input', render));

            $('prev').addEventListener('click', () => {
                dayEl.value = Number(dayEl.value) - 1;
                render();
            });

            $('next').addEventListener('click', () => {
                dayEl.value = Number(dayEl.value) + 1;
                render();
            });

            doneEl.addEventListener('change', () => {
                const recordId = `${state.max}:${state.day}`;
                if (doneEl.checked) {
                    state.completed[recordId] = true;
                } else {
                    delete state.completed[recordId];
                }
                save();
                render();
            });

            $('reset').addEventListener('click', () => {
                if (confirm('저장된 훈련 기록을 모두 지울까요?')) {
                    state = { max: 5, day: 1, completed: {} };
                    maxEl.value = 5;
                    dayEl.value = 1;
                    save();
                    render();
                }
            });

            render();
        })();
    </script>
</body>
</html>
